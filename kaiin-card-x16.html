<title>会員カードの印刷（試作 v0.3）</title>
<!--
  69l 会員カードの印刷 v0.3（2026-11-12・02_顧客管理・運営システム）
  ・カードの絵＝Claude Design のキャンバス「ここスマ 会員カード デザイン案」の A 改善案2（緑の丘とあたたかい地・入会の年月入り）＝松田さん 11/12 決定
  ・差し込む所は4つ＝data-f="yobina"（呼び名）／"bangou"（会員番号）／"qr"（会員証のQR）／"nyukai"（ご入会の年月。無ければ欄ごと隠す）
  ・値はアドレスの # より後ろ（#no=…&name=…&url=…&since=2026-12）で受け取る＝サーバーへ送られない。読んだらアドレスから消す。何も保存しない
  ・仕上がり 86×54mm・片面・フチなし（文字とQRは端から5mm以上内側）
-->

        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {

              bytes.push(b & 0xff);

          }
        }
      }

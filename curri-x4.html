<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ここスマ カリキュラム組立ツール</title>
<style>
  :root{
    --g:#0B4F42; --g2:#11866D; --gl:#E5F2EE; --gl2:#F4F8F6;
    --cream:#F4F8F6; --line:#D9E4E0; --ink:#333A38; --sub:#555555;
    --red:#B4402F; --redbg:#F9E9E5; --amber:#8a6112; --amberbg:#fdf8ee;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",sans-serif;color:var(--ink);background:#F4F8F6;font-size:14px;line-height:1.6}
  header{background:var(--g);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0;font-weight:900;letter-spacing:.02em}
  header .sub{font-size:11px;opacity:.8;letter-spacing:.1em}
  header .sp{flex:1}
  header button{font-family:inherit}
  .btn{background:#fff;color:var(--g);border:1px solid #fff;border-radius:4px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
  .btn:hover{background:var(--gl)}
  .btn.ghost{background:transparent;color:#fff}
  .btn.ghost:hover{background:rgba(255,255,255,.15)}
  .wrap{max-width:1400px;margin:0 auto;padding:16px 20px 60px}

  .ctabwrap{margin-bottom:12px}
  .ctabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .ctab{border:1px solid var(--line);background:#fff;border-radius:6px 6px 0 0;border-bottom:3px solid transparent;
        padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--sub);white-space:nowrap}
  .ctab.on{background:#fff;color:var(--g);border-color:var(--line);border-bottom:3px solid var(--g2)}
  .ctab .cm{font-weight:400;font-size:11px;opacity:.85;margin-left:8px}
  .ctab.add{border-style:dashed;color:var(--g2);border-bottom-color:transparent;padding:9px 14px}
  .cdel{border:0;background:none;color:#c0c8c4;cursor:pointer;font-size:14px;padding:0 0 0 8px}
  .cdel:hover{color:var(--red)}
  .setup{background:#fff;border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:16px}
  .setup h2{font-size:13px;color:var(--g);margin:0 0 10px;font-weight:700;letter-spacing:.06em}
  .row{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
  .f{display:flex;flex-direction:column;gap:3px}
  .f label{font-size:11px;color:var(--sub);font-weight:700}
  .f input,.f select{font-family:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:4px;background:#fff}
  .f input[type=number]{width:90px}
  .f input.wide{width:260px}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  @media(max-width:1000px){.cols{grid-template-columns:1fr}}
  .panel{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .panel>h2{font-size:13px;background:var(--gl);color:var(--g);margin:0;padding:8px 14px;font-weight:700;letter-spacing:.06em;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .panel>h2 .sp{flex:1}
  .pbody{padding:12px 14px;max-height:64vh;overflow:auto}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;padding:10px 14px;background:var(--gl2);border-bottom:1px solid var(--line)}
  .tab{border:1px solid var(--line);background:#fff;border-radius:4px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700;color:var(--sub);white-space:nowrap}
  .tab.on{background:var(--g);color:#fff;border-color:var(--g)}
  .tab .m{font-weight:400;font-size:11px;opacity:.85;margin-left:6px}
  .tab.over{border-color:var(--red);color:var(--red)}
  .tab.over.on{background:var(--red);color:#fff}

  .meter{padding:10px 14px;border-bottom:1px solid var(--line);background:var(--cream)}
  .meter .big{font-size:20px;font-weight:900}
  .bar{height:9px;background:#e6ebe8;border-radius:5px;overflow:hidden;margin-top:7px;position:relative}
  .bar i{display:block;height:100%;background:var(--g2);transition:width .18s}
  .bar.over i{background:var(--red)}
  .bar.ok i{background:#11866D}
  .st{font-size:12px;font-weight:700;margin-top:5px}
  .st.short{color:var(--amber)} .st.over{color:var(--red)} .st.ok{color:#11866D}

  .cat{margin-bottom:12px}
  .cat h3{font-size:12px;color:var(--g);margin:0 0 5px;font-weight:700;border-left:3px solid var(--g);padding-left:7px;display:flex;align-items:center;gap:8px}
  .cat h3 .n{font-weight:400;color:var(--sub);font-size:11px}
  .u{display:flex;align-items:center;gap:8px;padding:5px 7px;border-bottom:1px solid #eef1ef;font-size:13px}
  .u:hover{background:var(--gl2)}
  .u.sel{background:var(--gl)}
  .u.used{opacity:.42}
  .u input[type=checkbox]{width:16px;height:16px;accent-color:var(--g);cursor:pointer;flex-shrink:0}
  .u .nm{flex:1;cursor:pointer;min-width:0}
  .u .nm b{font-weight:500}
  .u .tag{font-size:10px;color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 4px;flex-shrink:0}
  .u .tag.done{color:var(--amber);border-color:#e0cfa8;background:var(--amberbg)}
  .u input.min{width:52px;text-align:right;font-family:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
  .u .del{border:0;background:none;color:#c0c8c4;cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
  .u .del:hover{color:var(--red)}

  
  .cgroup li{display:flex;align-items:center;gap:8px;padding:7px;border-bottom:1px solid #eef1ef;font-size:13px}
  .cgroup li .ord{width:20px;text-align:center;color:var(--g);font-weight:700;font-size:11px}
  .cgroup li .nm{flex:1;min-width:0}
  .cgroup li input.min{width:56px;text-align:right;font-family:inherit;font-size:12px;padding:2px 4px;border:1px solid var(--line);border-radius:3px}
  .cgroup li .mv{border:1px solid var(--line);background:#fff;border-radius:3px;cursor:pointer;font-size:11px;padding:1px 5px;color:var(--sub)}
  .cgroup li .x{border:0;background:none;color:#c0c8c4;cursor:pointer;font-size:16px;padding:0 3px}
  .cgroup li .x:hover{color:var(--red)}
  .empty{color:var(--sub);font-size:12px;padding:14px;text-align:center}
  .cgroup{margin-bottom:10px}
  .chead{display:flex;align-items:center;gap:8px;background:var(--gl);color:var(--g);font-weight:700;font-size:12px;padding:5px 10px;border-radius:4px 4px 0 0}
  .chead .cm{margin-left:auto;font-weight:700;font-size:12px}
  .cgroup ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-top:0;border-radius:0 0 4px 4px}

  .addbox{display:flex;gap:6px;padding:9px 14px;background:var(--gl2);border-top:1px solid var(--line);flex-wrap:wrap}
  .addbox input[type=text]{flex:1;min-width:150px;font-family:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line);border-radius:4px}
  .addbox input[type=number]{width:66px;font-family:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line);border-radius:4px}
  .addbox select{font-family:inherit;font-size:13px;padding:4px 7px;border:1px solid var(--line);border-radius:4px}
  .gbtn{background:var(--g);color:#fff;border:0;border-radius:4px;padding:5px 13px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .gbtn:hover{background:var(--g2)}
  .gbtn.sm{padding:3px 9px;font-size:11px}

  .foot{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line);background:var(--gl2);flex-wrap:wrap}

  #result{margin-top:16px}
  table.out{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
  table.out th,table.out td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top;word-break:auto-phrase}
  table.out th{background:var(--gl);color:var(--g);font-weight:700}
  table.out td.n{text-align:right;width:60px;white-space:nowrap}
  table.out tr.slot td{background:var(--cream);font-weight:700}
    table.out td.slotcell{background:var(--gl2);vertical-align:middle}
    table.out td.catcell{background:#fbfcfb;vertical-align:top}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--g);color:#fff;padding:9px 20px;border-radius:5px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
  .toast.on{opacity:1}
  .hint{font-size:11px;color:var(--sub);padding:0 14px 10px}
  @media print{
    header,.setup,.cols,.foot,.toast,.noprint{display:none!important}
    body{background:#fff}.wrap{padding:0}
    #result{margin:0}
  }
</style>
</head>
<body>

<header>
  <div>
    <div class="sub">こ こ ス マ ／ 出 張 教 室 の 商 談 ツ ー ル</div>
    <h1 id="title">カリキュラム組立ツール</h1>
  </div>
  <div class="sp"></div>
  <button class="btn ghost" onclick="expJSON()">保存（JSON）</button>
  <button class="btn ghost" onclick="document.getElementById('imp').click()">読み込み</button>
  <input type="file" id="imp" accept=".json" style="display:none" onchange="impJSON(this)">
  <button class="btn" onclick="window.print()">印刷</button>
</header>

<div class="wrap">

  <div class="ctabwrap">
    <div class="ctabs" id="ctabs"></div>
  </div>

  <div class="setup">
    <h2>1　枠の設定</h2>
    <div class="row">
      <div class="f"><label>このコースの名前</label><input type="text" id="cname" class="wide" value="初回参加者向け" oninput="renameCourse(this.value)"></div>
      <div class="f"><label>枠の数</label><input type="number" id="nslot" value="2" min="1" max="20" onchange="rebuild()"></div>
      <div class="f"><label>1枠の長さ（分）</label><input type="number" id="cap" value="60" min="5" max="600" step="5" onchange="applyCap()"></div>
      <div class="f"><label>&nbsp;</label><button class="gbtn" onclick="applyCap()">全枠に反映</button></div>
      <div class="f"><label>&nbsp;</label><button class="btn" style="border-color:var(--line);color:var(--sub)" onclick="clearAll()">選択をすべて消す</button></div>
    </div>
    <div class="hint" style="padding:8px 0 0">枠ごとに長さを変えたいときは、右側の各枠の分数を直接書き換えてください。</div>
  </div>

  <div class="cols">

    <div class="panel">
      <h2>2　カリキュラムを選択<span class="sp"></span><span style="font-weight:400;font-size:11px" id="ucount"></span></h2>
      <div class="pbody" id="units"></div>
      <div class="addbox">
        <select id="ncat"></select>
        <input type="text" id="nname" placeholder="実施項目（自由入力）">
        <input type="number" id="nmin" value="30" min="1" step="5">
        <button class="gbtn" onclick="addUnit()">実施項目を追加</button>
      </div>
      <div class="hint">分数は直接書き換えられます（目安時間）。枠に入れたあとの調整は右側で。</div>
    </div>

    <div class="panel">
      <h2>3　枠の組み立て</h2>
      <div class="tabs" id="tabs"></div>
      <div class="meter" id="meter"></div>
      <div class="pbody" style="max-height:46vh"><div id="slot"></div></div>
      <div class="foot">
        <button class="gbtn" onclick="prevSlot()">← 前の枠</button>
        <button class="gbtn" onclick="nextSlot()">この枠を確定して次へ →</button>
        <div style="flex:1"></div>
        <button class="btn" style="border-color:var(--line);color:var(--sub)" onclick="clearSlot()">この枠を空にする</button>
      </div>
    </div>

  </div>

  <div id="result"></div>
  <div class="row noprint" style="margin-top:10px">
    <button class="gbtn" onclick="copyText()">カリキュラムをコピー</button>
    <button class="btn" style="border-color:var(--line);color:var(--sub)" onclick="copyMD()">Markdownでコピー</button>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* ---------- 単元マスタ（初期値） ---------- */
const CATS = {
  S:"センター業務", K:"スマホの便利機能", M:"マップ・ナビ",
  A:"安心・安全に使うために", D:"災害への備え",
  L1:"LINEの基本", L2:"LINEの便利機能", L3:"LINEを安全に使うには",
  P:"写真を楽しむ", V:"動画を楽しむ", O:"音楽を楽しむ",
  H:"健康管理", X:"その他"
};
const SEED = [
  ["S","求人情報の探し方",20,1],["S","お知らせの見かた",15,1],
  ["S","会員クラウドサービスへのログイン",20,1],["S","配分金明細の確認",35,1],
  ["S","配分金支払証明書のダウンロード",20,0],["S","就業報告のオンライン提出",30,0],
  ["S","センターからの連絡をメールで受け取る",25,0],["S","アンケート・行事申込のWEB回答",25,0],

  ["K","スクリーンショットの撮り方",15,1],
  ["K","ユーザー辞書の使い方（文字入力を楽に）",20,0],
  ["K","音声入力の使い方",20,0],
  ["K","通話中のスピーカーの使い方",15,1],
  ["K","ホーム画面に緊急連絡先を登録",20,0],
  ["K","ホーム画面によく見るページを貼り付け",20,1],
  ["K","QRコードの読み取り方",15,1],
  ["K","文字を大きくする設定",15,0],
  ["K","音量と着信音の設定",15,0],
  ["K","調べたいことの検索のしかた",30,1],
  ["K","電池を長持ちさせる設定",15,0],
  ["K","データ通信量の確認",20,0],

  ["M","住所から場所を探す",20,0],
  ["M","ストリートビューで下見する",20,0],
  ["M","目的地までの道順を調べる",25,1],
  ["M","所要時間を調べる（徒歩・バス・車）",20,0],
  ["M","自宅とよく行く場所を登録する",15,0],
  ["M","近くの施設を探す（病院・薬局・郵便局）",20,0],
  ["M","乗換案内で電車の時間を調べる",30,1],
  ["M","避難所を地図で探す",20,0],

  ["A","迷惑メール・SMSの見分け方",30,0],
  ["A","偽の警告画面への対処",20,0],
  ["A","無料クリーナーアプリのトラブル",20,0],
  ["A","入れてはいけないアプリの見分け方",25,0],
  ["A","迷惑電話への対処",20,0],
  ["A","IDとパスワードの管理",20,0],
  ["A","個人情報を守る設定",20,0],
  ["A","困ったときの相談先",15,0],

  ["D","緊急速報の設定",15,0],
  ["D","災害用伝言板の使い方",25,0],
  ["D","SNSで災害情報を集める",25,0],
  ["D","ラジオアプリで情報を聞く",25,0],
  ["D","家族に一斉に連絡する",20,0],
  ["D","モバイルバッテリーの使い方",20,0],
  ["D","停電に備えた設定",15,0],

  ["L1","LINEをはじめる（登録・初期設定）",30,0],
  ["L1","友だちを追加する",20,0],
  ["L1","メッセージを送る・受け取る",25,0],
  ["L1","スタンプを使う",20,0],
  ["L1","既読と未読のしくみ",15,0],
  ["L1","LINEで電話をかける",20,0],

  ["L2","写真や動画を送る",25,0],
  ["L2","グループを作る",25,0],
  ["L2","ビデオ通話をする",25,0],
  ["L2","アルバムで写真をまとめる",25,0],
  ["L2","ノートに大事な連絡を残す",20,0],
  ["L2","位置情報を共有する",20,0],
  ["L2","音声メッセージを送る",15,0],

  ["L3","知らない人からのメッセージへの対処",20,0],
  ["L3","乗っ取りを防ぐ設定",25,0],
  ["L3","友だち追加の設定を見直す",20,0],
  ["L3","送る前に確認したいこと",15,0],

  ["P","写真の撮り方の基本",25,0],
  ["P","明るさとピントを合わせる",20,0],
  ["P","花や料理をきれいに撮る",25,0],
  ["P","撮った写真を探す",20,0],
  ["P","アルバムに整理する",25,0],
  ["P","写真をプリントする",25,0],
  ["P","写真を家族に送る",20,0],
  ["P","いらない写真を削除する",15,0],

  ["V","YouTubeで動画を探す",25,0],
  ["V","お気に入りを登録する",20,0],
  ["V","音量と画質を調整する",15,0],
  ["V","動画を撮る",25,0],
  ["V","撮った動画を送る",20,0],

  ["O","ラジオアプリで番組を聞く",25,0],
  ["O","好きな曲を探して聞く",25,0],
  ["O","イヤホンの使い方",15,0],

  ["H","歩数を記録する",25,0],
  ["H","脳トレアプリで頭の体操",30,1],
  ["H","健康記録アプリの使い方",25,0],
  ["H","散歩コースを地図で作る",25,0],
  ["H","お薬の飲み忘れを防ぐ",20,0],

  ["X","前回の復習",15,1],
  ["X","質疑応答・個別サポート",15,0]
];

/* ---------- 状態 ---------- */
let S = null;
const KEY = "curriculum_builder_v3";

function newCourse(name, cap){
  return { name:name, cur:0, slots:[ {name:"1枠目",cap:cap,items:[]}, {name:"2枠目",cap:cap,items:[]} ] };
}
function seedState(){
  return {
    units: SEED.map((u,i)=>({id:"u"+i, cat:u[0], name:u[1], min:u[2], done:!!u[3]})),
    courses: [ newCourse("初回参加者向け",60) ],
    ccur: 0,
    seq: SEED.length
  };
}
function C(){ return S.courses[S.ccur]; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function load(){
  try{ const r = localStorage.getItem(KEY); if(r){ S = JSON.parse(r); if(S && S.courses && S.courses.length) return; } }catch(e){}
  S = seedState();
}

/* ---------- 描画 ---------- */
function render(){
  document.getElementById("cname").value = C().name;
  document.getElementById("nslot").value = C().slots.length;
  renderCourseTabs(); renderUnits(); renderTabs(); renderMeter(); renderSlot(); renderResult(); save();
}

function courseTotal(ci){
  return S.courses[ci].slots.reduce((a,sl)=>a+sl.items.reduce((x,y)=>x+(+y.min||0),0),0);
}
function renderCourseTabs(){
  const t = document.getElementById("ctabs");
  t.innerHTML = S.courses.map((c,i)=>{
    const cap = c.slots.reduce((a,s)=>a+s.cap,0);
    return `<button class="ctab ${i===S.ccur?'on':''}" onclick="goCourse(${i})">${esc(c.name)}<span class="cm">${c.slots.length}枠・${courseTotal(i)}/${cap}分</span>${i===S.ccur&&S.courses.length>1?`<span class="cdel" onclick="event.stopPropagation();delCourse(${i})" title="このコースを削除">×</span>`:''}</button>`;
  }).join("") + `<button class="ctab add" onclick="addCourse()">＋ コースを追加</button>`;
}

function usedIds(){
  const m = {};
  C().slots.forEach((sl,si)=> sl.items.forEach(it=>{ m[it.uid] = si; }));
  return m;
}

function renderUnits(){
  const box = document.getElementById("units");
  const used = usedIds(), cur = C().cur;
  let html = "";
  Object.keys(CATS).forEach(c=>{
    const list = S.units.filter(u=>u.cat===c);
    if(!list.length) return;
    html += `<div class="cat"><h3>${CATS[c]}<span class="n">${list.length}</span></h3>`;
    list.forEach(u=>{
      const inCur = C().slots[cur].items.some(i=>i.uid===u.id);
      const inOther = (used[u.id]!==undefined && used[u.id]!==cur);
      html += `<div class="u ${inCur?'sel':''} ${inOther?'used':''}">
        <input type="checkbox" ${inCur?'checked':''} onchange="toggle('${u.id}')">
        <span class="nm" onclick="toggle('${u.id}')"><b>${esc(u.name)}</b></span>
        ${u.done?'<span class="tag done">昨年実施</span>':''}
        ${inOther?`<span class="tag">${esc(C().slots[used[u.id]].name)}</span>`:''}
        <input class="min" type="number" value="${u.min}" min="1" step="5" onchange="setMin('${u.id}',this.value)">
        <span style="font-size:11px;color:var(--sub)">分</span>
        <button class="del" title="削除" onclick="delUnit('${u.id}')">×</button>
      </div>`;
    });
    html += `</div>`;
  });
  box.innerHTML = html;
  document.getElementById("ucount").textContent = S.units.length + "項目";
}

function renderTabs(){
  const t = document.getElementById("tabs");
  t.innerHTML = C().slots.map((sl,i)=>{
    const sum = total(i), over = sum > sl.cap;
    return `<button class="tab ${i===C().cur?'on':''} ${over?'over':''}" onclick="go(${i})">${esc(sl.name)}<span class="m">${sum}/${sl.cap}分</span></button>`;
  }).join("") + `<button class="tab" onclick="addSlot()" title="枠を追加">＋枠</button>`;
}

function total(i,ci){ const c = (ci===undefined)?C():S.courses[ci]; return c.slots[i].items.reduce((a,b)=>a+(+b.min||0),0); }

function renderMeter(){
  const sl = C().slots[C().cur], sum = total(C().cur), rest = sl.cap - sum;
  const pct = Math.min(100, sl.cap? sum/sl.cap*100 : 0);
  let cls="", msg="";
  if(rest === 0){ cls="ok"; msg="ちょうど収まりました"; }
  else if(rest > 0){ cls="short"; msg=`あと <b>${rest}分</b> 空いています`; }
  else { cls="over"; msg=`<b>${-rest}分 オーバー</b>しています`; }
  document.getElementById("meter").innerHTML = `
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
      <input value="${esc(sl.name)}" onchange="renameSlot(this.value)"
        style="font-family:inherit;font-size:14px;font-weight:700;color:var(--g);border:0;border-bottom:1px dashed var(--line);background:none;width:110px">
      <span class="big">${sum}</span><span style="color:var(--sub);font-size:13px">分</span>
      <span style="color:var(--sub)">／</span>
      <input type="number" value="${sl.cap}" min="5" step="5" onchange="setCap(this.value)"
        style="font-family:inherit;font-size:14px;width:62px;padding:2px 5px;border:1px solid var(--line);border-radius:3px;text-align:right">
      <span style="color:var(--sub);font-size:13px">分</span>
      <span style="flex:1"></span>
      <span style="font-size:12px;color:var(--sub)">${sl.items.length}項目</span>
    </div>
    <div class="bar ${cls==='over'?'over':(cls==='ok'?'ok':'')}"><i style="width:${pct}%"></i></div>
    <div class="st ${cls}">${msg}</div>`;
}

function grouped(si,ci){
  const c = (ci===undefined)?C():S.courses[ci];
  const items = c.slots[si].items, order = Object.keys(CATS), map = {};
  items.forEach((it,idx)=>{ const k = it.cat || "X"; (map[k]=map[k]||[]).push(Object.assign({},it,{_i:idx})); });
  return order.filter(k=>map[k]).map(k=>({cat:k, items:map[k], sum:map[k].reduce((a,b)=>a+(+b.min||0),0)}));
}

function renderSlot(){
  const box = document.getElementById("slot");
  const gs = grouped(C().cur);
  if(!gs.length){ box.innerHTML = `<div class="empty">左の一覧から実施項目をえらんでください</div>`; return; }
  box.innerHTML = gs.map(g=>`
    <div class="cgroup">
      <div class="chead">${esc(CATS[g.cat])}<span class="cm">${g.sum}分</span></div>
      <ul>
      ${g.items.map((it,pos)=>`
        <li>
          <span class="ord">${pos+1}</span>
          <span class="nm">${esc(it.name)}</span>
          <button class="mv" onclick="moveIn('${g.cat}',${pos},-1)" ${pos===0?'disabled':''}>↑</button>
          <button class="mv" onclick="moveIn('${g.cat}',${pos},1)" ${pos===g.items.length-1?'disabled':''}>↓</button>
          <input class="min" type="number" value="${it.min}" min="1" step="5" onchange="setItemMin(${it._i},this.value)">
          <span style="font-size:11px;color:var(--sub)">分</span>
          <button class="x" onclick="rm(${it._i})">×</button>
        </li>`).join("")}
      </ul>
    </div>`).join("");
}

function renderResult(){
  const r = document.getElementById("result");
  const any = S.courses.some(c=>c.slots.some(s=>s.items.length));
  if(!any){ r.innerHTML=""; return; }
  let html = "";
  S.courses.forEach((c,ci)=>{
    if(!c.slots.some(s=>s.items.length)) return;
    let rows = "";
    c.slots.forEach((sl,i)=>{
      const gs = grouped(i,ci), sum = total(i,ci), rest = sl.cap - sum;
      const note = rest===0 ? "" : (rest>0 ? `　あと${rest}分` : `　${-rest}分オーバー`);
      if(!gs.length){
        rows += `<tr class="slot"><td>${esc(sl.name)}</td><td colspan="2" style="color:var(--sub);font-weight:400">（未選択）</td><td class="n">0 / ${sl.cap}分</td></tr>`;
        return;
      }
      const n = gs.reduce((a,g)=>a+g.items.length,0);
      let first = true;
      gs.forEach(g=>{
        g.items.forEach((it,j)=>{
          rows += `<tr>`;
          if(first){ rows += `<td rowspan="${n}" class="slotcell"><b>${esc(sl.name)}</b><br><span style="font-size:11px;color:var(--sub)">${sum}/${sl.cap}分${note}</span></td>`; first=false; }
          if(j===0){ rows += `<td rowspan="${g.items.length}" class="catcell"><b>${esc(CATS[g.cat])}</b><br><span style="font-size:11px;color:var(--sub)">${g.sum}分</span></td>`; }
          rows += `<td>${esc(it.name)}</td><td class="n">${it.min}分</td></tr>`;
        });
      });
    });
    const g = courseTotal(ci), gc = c.slots.reduce((a,s)=>a+s.cap,0);
    html += `<h2 style="font-size:16px;color:var(--g);margin:22px 0 8px;border-bottom:2px solid var(--g);padding-bottom:5px">${esc(c.name)}</h2>
      <table class="out"><thead><tr><th style="width:128px">枠</th><th style="width:162px">カテゴリ</th><th>実施項目</th><th class="n">時間</th></tr></thead>
      <tbody>${rows}<tr class="slot"><td colspan="3"><b>${esc(c.name)}　合計</b>（全${c.slots.length}枠）</td><td class="n"><b>${g} / ${gc}分</b></td></tr></tbody></table>`;
  });
  r.innerHTML = html;
}

/* ---------- 操作 ---------- */
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(m){ const t=document.getElementById("toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1400); }

function goCourse(i){ S.ccur=i; render(); }
function addCourse(){
  const cap = +document.getElementById("cap").value||60;
  S.courses.push(newCourse((S.courses.length+1)+"つ目のコース", cap));
  S.ccur = S.courses.length-1; render();
  document.getElementById("cname").focus(); document.getElementById("cname").select();
  toast("コースを追加しました。名前を入れてください");
}
function delCourse(i){
  if(S.courses.length<=1){ toast("コースは1つ以上必要です"); return; }
  if(!confirm(`「${S.courses[i].name}」を削除しますか？`)) return;
  S.courses.splice(i,1);
  if(S.ccur>=S.courses.length) S.ccur = S.courses.length-1;
  render();
}
function renameCourse(v){ C().name = v; renderCourseTabs(); renderResult(); save(); }

function toggle(uid){
  const sl = C().slots[C().cur];
  const idx = sl.items.findIndex(i=>i.uid===uid);
  if(idx>=0){ sl.items.splice(idx,1); }
  else{ const u = S.units.find(x=>x.id===uid); sl.items.push({uid:u.id, cat:u.cat, name:u.name, min:u.min}); }
  render();
}
function rm(i){ C().slots[C().cur].items.splice(i,1); render(); }
function moveIn(cat,pos,d){
  const g = grouped(C().cur).find(x=>x.cat===cat); if(!g) return;
  const t = pos+d; if(t<0||t>=g.items.length) return;
  const a = C().slots[C().cur].items, i = g.items[pos]._i, j = g.items[t]._i;
  const tmp = a[i]; a[i] = a[j]; a[j] = tmp; render();
}
function setItemMin(i,v){ C().slots[C().cur].items[i].min = +v||0; render(); }
function setMin(uid,v){ const u=S.units.find(x=>x.id===uid); u.min=+v||0; render(); }
function delUnit(uid){
  if(!confirm("この実施項目を一覧から削除しますか？")) return;
  S.units = S.units.filter(u=>u.id!==uid);
  S.courses.forEach(c=> c.slots.forEach(sl=> sl.items = sl.items.filter(i=>i.uid!==uid)));
  render();
}
function addUnit(){
  const n = document.getElementById("nname").value.trim();
  if(!n){ toast("実施項目名を入れてください"); return; }
  const c = document.getElementById("ncat").value;
  const m = +document.getElementById("nmin").value||30;
  S.units.push({id:"u"+(S.seq++), cat:c, name:n, min:m, done:false});
  document.getElementById("nname").value="";
  render(); toast("追加しました");
}
function go(i){ C().cur=i; render(); }
function nextSlot(){
  const rest = C().slots[C().cur].cap - total(C().cur);
  if(rest > 0 && !confirm(`この枠はあと${rest}分空いています。次の枠へ進みますか？`)) return;
  if(rest < 0 && !confirm(`この枠は${-rest}分オーバーしています。次の枠へ進みますか？`)) return;
  if(C().cur < C().slots.length-1){ C().cur++; render(); }
  else { toast("このコースの枠が終わりました"); window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"}); }
}
function prevSlot(){ if(C().cur>0){ C().cur--; render(); } }
function addSlot(){ C().slots.push({name:(C().slots.length+1)+"枠目", cap:+document.getElementById("cap").value||60, items:[]}); C().cur=C().slots.length-1; render(); }
function rebuild(){
  const n = +document.getElementById("nslot").value||1, cap = +document.getElementById("cap").value||60;
  while(C().slots.length < n) C().slots.push({name:(C().slots.length+1)+"枠目", cap:cap, items:[]});
  while(C().slots.length > n){
    const last = C().slots[C().slots.length-1];
    if(last.items.length && !confirm("削除する枠に実施項目が入っています。消してよいですか？")){ document.getElementById("nslot").value=C().slots.length; return; }
    C().slots.pop();
  }
  if(C().cur >= C().slots.length) C().cur = C().slots.length-1;
  render();
}
function applyCap(){ const c=+document.getElementById("cap").value||60; C().slots.forEach(s=>s.cap=c); render(); }
function setCap(v){ C().slots[C().cur].cap = +v||60; render(); }
function renameSlot(v){ C().slots[C().cur].name = v || C().slots[C().cur].name; render(); }
function clearSlot(){ if(confirm("この枠の実施項目をすべて外しますか？")){ C().slots[C().cur].items=[]; render(); } }
function clearAll(){ if(confirm("このコースの選択をすべて消しますか？（一覧は残ります）")){ C().slots.forEach(s=>s.items=[]); C().cur=0; render(); } }

/* ---------- 出力 ---------- */
function plain(){
  const NL = String.fromCharCode(10);
  let t = "";
  S.courses.forEach(c=>{
    const ci = S.courses.indexOf(c);
    t += "■■ " + c.name + NL;
    c.slots.forEach((sl,i)=>{
      const sum=total(i,ci), rest=sl.cap-sum;
      const note = rest===0 ? "" : (rest>0 ? "（あと"+rest+"分）" : "（"+(-rest)+"分オーバー）");
      t += NL + "  ■ " + sl.name + "　" + sum + "/" + sl.cap + "分" + note + NL;
      grouped(i,ci).forEach(g=>{
        t += "　　【" + CATS[g.cat] + "】" + g.sum + "分" + NL;
        g.items.forEach(it=>{ t += "　　　・" + it.name + "　" + it.min + "分" + NL; });
      });
    });
    t += NL;
  });
  return t;
}
function md(){
  const NL = String.fromCharCode(10);
  let t = "";
  S.courses.forEach(c=>{
    const ci = S.courses.indexOf(c);
    t += "## " + c.name + NL + NL + "| 枠 | カテゴリ | 実施項目 | 時間 |" + NL + "|---|---|---|---:|" + NL;
    c.slots.forEach((sl,i)=>{
      let f = true;
      grouped(i,ci).forEach(g=>{
        g.items.forEach((it,j)=>{
          t += "| " + (f?sl.name:"") + " | " + (j===0? CATS[g.cat]+"（"+g.sum+"分）" : "") + " | " + it.name + " | " + it.min + "分 |" + NL;
          f = false;
        });
      });
      t += "| | | **" + sl.name + " 合計** | **" + total(i,ci) + "/" + sl.cap + "分** |" + NL;
    });
    t += NL;
  });
  return t;
}
function cp(s,m){
  navigator.clipboard.writeText(s).then(()=>toast(m)).catch(()=>{
    const ta=document.createElement("textarea"); ta.value=s; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove(); toast(m);
  });
}
function copyText(){ cp(plain(),"コピーしました"); }
function copyMD(){ cp(md(),"Markdownでコピーしました"); }

function expJSON(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="カリキュラム_" + (C().name||"案") + ".json";
  a.click(); toast("保存しました");
}
function impJSON(el){
  const f = el.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e=>{ try{
      const d = JSON.parse(e.target.result);
      if(!d.courses && d.slots){ d.courses=[{name:d.cname||"コース", cur:d.cur||0, slots:d.slots}]; d.ccur=0; }
      S = d; if(S.ccur==null) S.ccur=0; render(); toast("読み込みました");
    }catch(err){ alert("読み込めませんでした"); } };
  r.readAsText(f); el.value="";
}

/* ---------- 起動 ---------- */
document.getElementById("ncat").innerHTML = Object.keys(CATS).map(c=>`<option value="${c}">${CATS[c]}</option>`).join("");
load(); render();
</script>

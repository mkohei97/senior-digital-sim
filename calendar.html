<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室の予定｜ここスマ</title>
<meta name="description" content="ここスマ（藤井寺）の教室の予定と空き状況です。">
<style>
:root{--bg:#F4F6F5;--ink:#1F2A28;--sub:#3F4A47;--pri:#0F766E;--pri-d:#0B4F42;--line:#E3DFD2;--card:#FFFFFF;--full:#8A3B12;--full-bg:#FBEBDD;--ok-bg:#E6F2EF}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",sans-serif;font-size:18px;line-height:1.7}
header{background:#fff;border-bottom:1px solid var(--line)}
.hd{max-width:720px;margin:0 auto;padding:16px 16px 14px;display:flex;align-items:baseline;gap:12px}
.brand{font-weight:900;color:var(--pri-d);font-size:20px;letter-spacing:.04em}
h1{margin:0;font-size:24px}
main{max-width:720px;margin:0 auto;padding:16px 16px 40px}
.tabs{display:flex;gap:10px;margin:4px 0 16px}
.tabs button{flex:1;height:56px;border-radius:999px;border:2px solid var(--pri);background:#fff;color:var(--pri-d);font-size:19px;font-weight:700;font-family:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:#fff}
.day{background:var(--card);border-radius:18px;box-shadow:0 6px 18px rgba(31,42,40,.06);margin:0 0 12px;overflow:hidden}
.day h2{margin:0;padding:12px 18px;font-size:20px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:8px}
.day h2 .w{font-size:17px;color:var(--sub);font-weight:700}
.day h2 .w.sat{color:#2F5E9E}.day h2 .w.sun{color:#B42318}
.row{display:grid;grid-template-columns:64px 1fr auto;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid #EFECE3}
.row:first-of-type{border-top:none}
.tm{font-size:19px;font-weight:700;color:var(--pri-d)}
.tt{font-size:19px;font-weight:700;word-break:keep-all;overflow-wrap:anywhere}
.tt small{display:block;font-size:15px;color:var(--sub);font-weight:500}
.st{font-size:16px;font-weight:700;padding:4px 12px;border-radius:999px;white-space:nowrap}
.st.ok{background:var(--ok-bg);color:var(--pri-d)}
.st.full{background:var(--full-bg);color:var(--full)}
.empty,.msg{background:#fff;border-radius:18px;padding:28px 18px;text-align:center;color:var(--sub)}
.foot{margin-top:20px;background:#fff;border-radius:18px;padding:18px;font-size:17px}
.foot b{display:block;font-size:18px;margin-bottom:4px}
</style></head><body>
<header><div class="hd"><span class="brand">ここスマ</span><h1>教室の予定</h1></div></header>
<main>
  <div class="tabs" id="tabs"></div>
  <div id="list"><div class="msg">読み込んでいます</div></div>
  <div class="foot"><b>ご予約・お問い合わせ</b>LINEのトークでどうぞ。会員の方は、会員証のページから予約できます。</div>
</main>
<script>
var SUPA_URL='https://kravngifhbxywmpoydur.supabase.co', SUPA_KEY='sb_publishable_kxqrgfxUIyZk-pQmU8Jpbw_r9lmxb1E';
var W=['日','月','火','水','木','金','土'], cur=0;
function rpc(fn,a){return fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},body:JSON.stringify(a||{})}).then(function(r){return r.json();});}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function months(){var t=new Date(),a=[];for(var i=0;i<2;i++){var f=new Date(t.getFullYear(),t.getMonth()+i,1),l=new Date(t.getFullYear(),t.getMonth()+i+1,0);a.push({label:(f.getMonth()+1)+'月',from:ymd(i?f:t),to:ymd(l)});}return a;}
var M=months();
function tabs(){document.getElementById('tabs').innerHTML=M.map(function(m,i){return '<button type="button" class="'+(i===cur?'on':'')+'" onclick="go('+i+')">'+m.label+'</button>';}).join('');}
function go(i){cur=i;tabs();load();}
function load(){
  var L=document.getElementById('list'); L.innerHTML='<div class="msg">読み込んでいます</div>';
  rpc('cal_public',{p_from:M[cur].from,p_to:M[cur].to}).then(function(r){
    if(!r||!r.ok){L.innerHTML='<div class="msg">予定を読み込めませんでした。時間をおいて、もう一度開いてください。</div>';return;}
    var ss=r.sessions||[]; if(!ss.length){L.innerHTML='<div class="empty">'+M[cur].label+'の予定は、まだありません。</div>';return;}
    var by={},order=[]; ss.forEach(function(s){if(!by[s.held_on]){by[s.held_on]=[];order.push(s.held_on);}by[s.held_on].push(s);});
    L.innerHTML=order.map(function(d){var p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]),w=dt.getDay();
      return '<section class="day"><h2>'+(+p[1])+'月'+(+p[2])+'日<span class="w'+(w===6?' sat':w===0?' sun':'')+'">（'+W[w]+'）</span></h2>'+by[d].map(function(s){
        return '<div class="row"><span class="tm">'+esc(s.start_time)+'</span><span class="tt">'+esc(s.title||'教室')+'</span><span class="st '+(s.full?'full':'ok')+'">'+(s.full?'満席':'空きあり')+'</span></div>';}).join('')+'</section>';}).join('');
  }).catch(function(){L.innerHTML='<div class="msg">予定を読み込めませんでした。時間をおいて、もう一度開いてください。</div>';});
}
tabs();load();
</script></body></html>

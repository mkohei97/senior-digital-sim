<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>教室の予定｜ここスマ</title>
<meta name="description" content="ここスマ（藤井寺）の教室の予定と空き状況です。">
<meta name="robots" content="noindex">
<style>
/* 教室の予定 試験版 v0.3（2026-11-11）＝案B（白い地・ネイビー・罫線）。予約の日付の一覧（yoyaku 試験版 v0.5e）と同じ形：日付の帯｜時刻｜講座名｜空席・満席の札 */
:root{--ink:#1C003C;--sub:#4B3B63;--line:#E3DFD2;--pale:#F5F4F0;--mark:#008F6D;--ok:#00785C;--full:#B42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;background:#FFFFFF}
body{margin:0;background:#FFFFFF;color:var(--ink);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif;font-size:20px;line-height:1.7;-webkit-font-smoothing:antialiased}
.testbar{background:var(--pale);color:var(--ink);font-size:16px;font-weight:700;text-align:center;padding:8px 12px;line-height:1.5}
.phone{max-width:560px;margin:0 auto;padding:0 18px 60px}
header{padding:22px 0 6px}
.shop{display:flex;align-items:center;gap:9px;font-size:19px;font-weight:800;letter-spacing:.04em}
.shop.logo{gap:8px;letter-spacing:0}.shop.logo img{height:44px;width:auto;display:block}
h1{margin:10px 0 8px;font-size:26px;font-weight:800;line-height:1.5}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:0 0 18px}
.tabs button{flex:1;height:56px;background:#FFFFFF;border:0;border-bottom:4px solid #FFFFFF;color:var(--sub);font-size:20px;font-weight:800;font-family:inherit;cursor:pointer}
.tabs button.on{border-bottom-color:var(--ink);color:var(--ink)}
.dayhead{margin:0;padding:8px 10px;background:var(--ink);color:#FFFFFF;font-size:20px;font-weight:800;line-height:1.5}
.row{display:flex;align-items:center;gap:8px;min-height:64px;padding:10px 10px;border-bottom:1px solid var(--line)}
.tm{flex:none;min-width:66px;margin-right:6px;font-size:20px;font-weight:800;line-height:1.45;white-space:nowrap}
.nm{flex:1;min-width:0;font-size:clamp(17px, calc((100vw - 204px) / 8.1), 20px);font-weight:800;line-height:1.4;text-wrap:balance;line-break:strict}
.tag{display:inline-flex;align-items:center;justify-content:center;flex:none;width:60px;height:32px;box-sizing:border-box;border-radius:6px;background:#FFFFFF;border:1.5px solid currentColor;font-size:16px;font-weight:800;white-space:nowrap}
.tag.open{color:var(--ok)}
.tag.full{color:var(--full)}
.msg{padding:28px 6px;text-align:center;color:var(--sub);font-size:20px;font-weight:700;line-height:1.9;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.foot{margin-top:28px;display:flex;flex-direction:column;gap:18px}
.foot .blk{display:flex;flex-direction:column;gap:8px}
.foot b{font-size:18px;font-weight:800}
.foot p{margin:0;font-size:19px;line-height:1.7}
.btn{display:block;min-height:64px;line-height:1.4;padding:17px 14px;border-radius:8px;background:var(--ink);color:#FFFFFF;font-size:24px;font-weight:800;text-align:center;text-decoration:none}
.ver{margin:34px 0 0;text-align:center;font-size:16px;color:var(--sub)}
</style></head><body>

<script>
/* 教室の予定（公開・読むだけ）。読むのは cal_public だけ。?demo=1 は見本のデータ */
var SUPA_URL='https://kravngifhbxywmpoydur.supabase.co', SUPA_KEY='sb_publishable_kxqrgfxUIyZk-pQmU8Jpbw_r9lmxb1E';
var DEMO=/[?&]demo=1/.test(location.search);
var W=['日','月','火','水','木','金','土'], cur=0;
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
function demoData(a){
  var out=[], d=new Date(); d.setDate(d.getDate()+1);
  var names=[['10:30','LINEの基本','',false],['13:30','あやしいメール・SMS','あやしいメール',false],['10:30','カメラと写真','',true],['13:30','スマホの困りごと','',false],['10:30','文字入力','',false]];
  var i=0;
  while(i<names.length){
    var w=d.getDay();
    if(w!==3&&w!==4){
      var k=ymd(d);
      if(k>=a.p_from&&k<=a.p_to){ out.push({held_on:k,start_time:names[i][0],title:names[i][1],short_title:names[i][2],full:names[i][3]}); if(i+1<names.length&&i%2===0){ out.push({held_on:k,start_time:names[i+1][0],title:names[i+1][1],short_title:names[i+1][2],full:names[i+1][3]}); i++; } }
      i++;
    }
    d.setDate(d.getDate()+1);
  }
  return {ok:true,sessions:out};
}
function rpc(fn,a){
  if(DEMO) return Promise.resolve(demoData(a));
  return fetch(SUPA_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY},body:JSON.stringify(a||{})}).then(function(r){return r.json();});
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function months(){var t=new Date(),a=[];for(var i=0;i<2;i++){var f=new Date(t.getFullYear(),t.getMonth()+i,1),l=new Date(t.getFullYear(),t.getMonth()+i+1,0);a.push({label:(f.getMonth()+1)+'月',from:ymd(i?f:t),to:ymd(l)});}return a;}
var M=months();
function tabs(){document.getElementById('tabs').innerHTML=M.map(function(m,i){return '<button type="button" aria-pressed="'+(i===cur)+'" class="'+(i===cur?'on':'')+'" onclick="go('+i+')">'+m.label+'</button>';}).join('');}
function go(i){cur=i;tabs();load();}
function load(){
  var L=document.getElementById('list'); L.innerHTML='<div class="msg">読み込んでいます</div>';
  rpc('cal_public',{p_from:M[cur].from,p_to:M[cur].to}).then(function(r){
    if(!r||!r.ok){L.innerHTML='<div class="msg">予定を読み込めませんでした。<br>時間をおいて、もう一度開いてください。</div>';return;}
    var ss=r.sessions||[]; if(!ss.length){L.innerHTML='<div class="msg">'+M[cur].label+'の予定は、まだありません。</div>';return;}
    var by={},order=[]; ss.forEach(function(s){if(!by[s.held_on]){by[s.held_on]=[];order.push(s.held_on);}by[s.held_on].push(s);});
    L.innerHTML=order.map(function(d){var p=d.split('-'),dt=new Date(+p[0],+p[1]-1,+p[2]),w=dt.getDay();
      return '<h2 class="dayhead">'+(+p[1])+'月'+(+p[2])+'日（'+W[w]+'）</h2>'+by[d].map(function(s){
        return '<div class="row"><span class="tm">'+esc(s.start_time)+'</span><span class="nm">'+esc(s.short_title||s.title||'教室')+'</span><span class="tag '+(s.full?'full':'open')+'">'+(s.full?'満席':'空席')+'</span></div>';}).join('');}).join('');
  }).catch(function(){L.innerHTML='<div class="msg">予定を読み込めませんでした。<br>時間をおいて、もう一度開いてください。</div>';});
}
/* 会員証を開いたことのある端末では、予約へ進むボタンを出す */
(function(){
  var t=''; try{ t=localStorage.getItem('kokosuma_token')||''; }catch(e){}
  if(t||DEMO){ document.getElementById('f-member').hidden=false; document.getElementById('f-kaiin').hidden=true; if(DEMO) document.getElementById('f-yoyaku').href='yoyaku-test.html?demo=1'; }
})();
tabs();load();
</script></body></html>

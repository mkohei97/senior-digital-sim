<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>みんなで脳トレ（教室の大画面）</title>
<style>
  :root { --ink: #1F2A28; --sub: #5A6360; --brand: #0F766E; --action: #11866D; --deep: #0B4F42; --red: #C8412F; --ansc: #0F7A5A; --clap: #C8761E; --line: #E3DFD2; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans CJK JP", "Yu Gothic", Meiryo, sans-serif; color: var(--ink);
    background: radial-gradient(ellipse at 12% 8%, #E3F4EE 0%, rgba(227,244,238,0) 46%), radial-gradient(ellipse at 92% 88%, #FBEADF 0%, rgba(251,234,223,0) 50%), #F7F8F6;
    user-select: none; -webkit-user-select: none; }
  .emo { font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif; }
  /* 上の帯 */
  .top { position: fixed; left: 0; right: 0; top: 0; height: 7vh; display: flex; align-items: center; gap: 1.6vw; padding: 0 2.4vw; z-index: 5; }
  .top .logo { font-size: 2.2vh; font-weight: 700; color: var(--deep); letter-spacing: .08em; }
  .top .ttl { font-size: 3vh; font-weight: 700; }
  .top .clock { margin-left: auto; font-size: 2.4vh; color: var(--sub); cursor: pointer; font-variant-numeric: tabular-nums; }
  .top .clock { font-size: 2.8vh; } .top .clock b { font-size: 3.4vh; color: var(--ink); margin-left: .6vw; }
  /* 舞台 */
  .stage { position: fixed; left: 0; right: 0; top: 7vh; bottom: 11vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3vh; padding: 0 4vw; text-align: center; }
  .hint { font-size: 3.4vh; color: var(--sub); font-weight: 700; }
  .hint .emo { font-size: 3.6vh; }
  .glass { background: rgba(255,255,255,.86); border: 1px solid rgba(255,255,255,.9); border-radius: 4vh; box-shadow: 0 2vh 5vh rgba(24,48,42,.10); }
  .fade-in { animation: fin .35s ease-out both; }
  @keyframes fin { from { opacity: 0; transform: translateY(1.4vh) scale(.98); } to { opacity: 1; transform: none; } }
  .pop { animation: pop .4s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  /* 一覧 */
  .menu { display: grid; grid-template-columns: repeat(5, 1fr); gap: 2.2vh 1.6vw; width: 100%; max-width: 170vh; }
  .mc { padding: 2vh 1.4vw; display: flex; flex-direction: column; align-items: flex-start; gap: .8vh; text-align: left; cursor: pointer; min-height: 18vh; }
  .mc:active { transform: scale(.98); }
  .mc .ic { font-size: 6vh; line-height: 1; }
  .mc b { font-size: 3.4vh; }
  .mc span { font-size: 2.1vh; color: var(--sub); line-height: 1.55; }
  .mc em { font-style: normal; margin-top: auto; font-size: 1.9vh; color: var(--deep); background: #E3F2F0; border-radius: 99px; padding: .4vh 1.2vh; }
  .mc.soon { opacity: .55; cursor: default; }
  .welcome { font-size: 5vh; font-weight: 800; letter-spacing: .04em; }
  .welcome small { display: block; font-size: 2.6vh; font-weight: 400; color: var(--sub); margin-top: 1vh; letter-spacing: 0; }
  /* 共通の大きな字 */
  .big { font-size: 13vh; font-weight: 800; line-height: 1.2; }
  .mid { font-size: 7vh; font-weight: 800; line-height: 1.35; }
  .sm { font-size: 3.4vh; color: var(--sub); line-height: 1.6; }
  .order { display: inline-block; font-size: 8vh; font-weight: 800; border: .7vh solid; border-radius: 99px; padding: .6vh 5vh; background: rgba(255,255,255,.95); }
  .ans { color: var(--ansc); }
  ruby rt { font-size: .42em; color: var(--sub); font-weight: 500; letter-spacing: 0; }
  .lv { display: flex; gap: 1vw; }
  .lv span { font-size: 2.4vh; padding: .8vh 2vh; border-radius: 99px; border: 2px solid var(--line); background: #fff; cursor: pointer; color: var(--sub); font-weight: 700; }
  .lv span.on { background: var(--deep); border-color: var(--deep); color: #fff; }
  /* じゃんけん */
  .jk-row { display: flex; align-items: center; gap: 5vw; }
  .jk-cpu { display: flex; flex-direction: column; align-items: center; gap: 1vh; padding: 2vh 5vw; }
  .jk-cpu .who { font-size: 3vh; color: var(--sub); font-weight: 700; }
  .jk-cpu .h { font-size: 24vh; line-height: 1.05; }
  .jk-a { display: flex; flex-direction: column; align-items: center; gap: 1vh; }
  .jk-a .h { font-size: 20vh; line-height: 1.05; }
  .jk-a b { font-size: 5vh; }
  /* 色と文字 */
  .iro { font-size: 30vh; font-weight: 900; line-height: 1.1; letter-spacing: .04em; padding: 0 6vw; }
  /* 暗算 */
  .chain { display: flex; align-items: center; gap: 2vw; flex-wrap: wrap; justify-content: center; }
  .chain .n { font-size: 14vh; font-weight: 800; }
  .chain .op { font-size: 12vh; font-weight: 800; color: var(--deep); }
  .chain .old { opacity: .28; font-size: 8vh; }
  /* 三択 */
  .qz-q { font-size: 5.6vh; font-weight: 800; line-height: 1.45; max-width: 150vh; }
  .qz-c { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2vw; width: 100%; max-width: 160vh; }
  .qz-c div { font-size: 5vh; font-weight: 800; padding: 3vh 2vw; border-radius: 3vh; background: #fff; border: .5vh solid var(--line); display: flex; align-items: center; justify-content: center; gap: 1.4vw; }
  .qz-c div i { font-style: normal; font-size: 4vh; width: 6.4vh; height: 6.4vh; border-radius: 50%; background: #EEF2F0; display: inline-flex; align-items: center; justify-content: center; color: var(--sub); flex-shrink: 0; }
  .qz-c div.ok { border-color: var(--ansc); background: #EAF6F0; color: var(--ansc); box-shadow: 0 0 0 .5vh rgba(15,122,90,.15); } .qz-c div.ok i { background: var(--ansc); color: #fff; }
  .qz-c div.dim { opacity: .35; }
  .qz-t { font-size: 3.4vh; color: var(--sub); line-height: 1.6; max-width: 150vh; }
  /* 指の体操 */
  .yb-t { font-size: 7vh; font-weight: 800; }
  .yb-h { font-size: 16vh; line-height: 1.1; }
  .yb-s { font-size: 4.2vh; line-height: 1.7; max-width: 140vh; }
  /* 数える */
  .kz-n { font-size: 34vh; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .kz-n.clap { color: var(--clap); }
  /* 操作（講師） */
  .ctl { position: fixed; right: 2vw; bottom: 2vh; display: flex; gap: .8vw; z-index: 6; }
  .ctl button { font-family: inherit; font-size: 2.4vh; font-weight: 700; border: none; border-radius: 99px; padding: 1.6vh 2.4vw; background: rgba(255,255,255,.9); color: var(--sub); box-shadow: 0 .6vh 1.6vh rgba(0,0,0,.08); cursor: pointer; }
  .ctl button.go { background: var(--action); color: #fff; padding: 1.6vh 3.6vw; font-size: 2.8vh; }
  .ctl button:active { transform: translateY(2px); }
  .ctl.hide { display: none; }
  body.home #b10, body.home #go, body.home .inq { display: none; }
  .prog { position: fixed; left: 2.4vw; bottom: 3vh; font-size: 2.2vh; color: var(--sub); z-index: 6; }
  /* 10秒 */
  .cd { position: fixed; right: 2.4vw; top: 8vh; width: 12vh; height: 12vh; z-index: 6; display: none; }
  .cd.on { display: block; }
  .cd svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .cd b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 5vh; font-weight: 800; }
  /* スタンプのQR */
  .qr img { width: 58vh; height: 58vh; image-rendering: pixelated; }
</style>
</head>
<body>
<div class="top">
  <span class="logo">ここスマ</span><span class="ttl" id="ttl">みんなで脳トレ</span>
  <span class="clock" id="clock"><span id="clock-d"></span> <b id="clock-t"></b></span>
</div>
<div class="cd" id="cd"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="17" fill="rgba(255,255,255,.9)" stroke="#E3DFD2" stroke-width="4"></circle><circle id="cd-r" cx="20" cy="20" r="17" fill="none" stroke="#11866D" stroke-width="4" stroke-dasharray="106.8" stroke-dashoffset="0" stroke-linecap="round"></circle></svg><b id="cd-n">10</b></div>
<div class="stage" id="stage"></div>
<div class="prog" id="prog"></div>
<div class="ctl" id="ctl">
  <button class="inq" onclick="goMenu()">一覧</button>
  <button class="inq" onclick="back()">◀ もどる</button>
  <button id="b10" onclick="cdStart(10)">10秒</button>
  <button class="go" id="go" onclick="next()">次へ ▶</button>
  <button onclick="fullToggle()">全画面</button>
</div>
<script>

var KOTOWAZA = [

  { q: '急がば 【？】', c: ['回れ', '走れ', '戻れ'], a: 0, t: '急ぐときこそ、遠回りでも安全で確実な道を選ぶほうがよい、という教えです。' },

  { q: '七転び 【？】', c: ['八起き', '七起き', '九起き'], a: 0, t: '何度失敗しても、くじけずに立ち上がることのたとえです。' },

  { q: '早起きは三文の 【？】', c: ['徳', '損', '宝'], a: 0, t: '朝早く起きると、何かしら良いことがあるものだ、という意味です。' },
  { q: '出る杭は 【？】', c: ['打たれる', '抜かれる', '折られる'], a: 0, t: '才能があって目立つ人は、とかく人から非難されがちだ、というたとえです。' },
  { q: '猫に 【？】', c: ['小判', '大判', '小銭'], a: 0, t: '価値のわからない者には、どんな貴重なものも役に立たない、という意味です。' },

  { q: '石橋を 【？】て渡る', c: ['叩い', '眺め', '数え'], a: 0, t: '固い石橋でも叩いて確かめてから渡る。用心の上にも用心を重ねることです。' },

  { q: '灯台 【？】暗し', c: ['下', '上', '横'], a: 0, t: '身近なことは、かえって気がつきにくいものだ、というたとえです。' },

  { q: '千里の道も 【？】から', c: ['一歩', '一里', '一日'], a: 0, t: 'どんな大きな事業も、まず手近なことから始まる、というたとえです。' },
  { q: '蛙の子は 【？】', c: ['蛙', '蛇', '亀'], a: 0, t: '子は親に似るものだ、平凡な親からは平凡な子が育つ、という意味で使われます。' }
];
var QUIZ = [
  { region: '藤井寺・羽曳野', q: '藤井寺市の名前のもとになったお寺「葛井寺」。なんと読むでしょう?', c: ['ふじいでら', 'くずいでら', 'かつらいでら'], a: 0, t: '西国三十三所の第五番札所。国宝の千手観音さまで有名です。' },
  { region: '藤井寺・羽曳野', q: '古市古墳群が世界遺産に登録されたのは、いつでしょう?', c: ['2019年(令和元年)', '1999年(平成11年)', '2009年(平成21年)'], a: 0, t: '「百舌鳥・古市古墳群」として大阪府初の世界遺産になりました。' },

  { region: '藤井寺・羽曳野', q: '羽曳野市に古墳が残る「白鳥伝説」の主人公は、だれでしょう?', c: ['ヤマトタケル', '聖徳太子', 'オオクニヌシ'], a: 0, t: '白鳥になって羽を曳くように飛んだ姿が「羽曳野」の地名の由来と伝わります。' },

var HAND = { g: { e: '✊', n: 'グー' }, c: { e: '✌️', n: 'チョキ' }, p: { e: '✋', n: 'パー' } };
var BEAT = { g: 'c', c: 'p', p: 'g' };   /* g は c に勝つ */
function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
